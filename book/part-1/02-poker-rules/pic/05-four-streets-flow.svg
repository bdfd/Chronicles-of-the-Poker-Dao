<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Texas Hold’em（德州扑克）四条下注轮次流程图</title>
  <desc id="desc">依次展示翻牌前、翻牌、转牌和河牌四条下注轮次，以及各阶段桌面公共牌数量。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#312719" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8c6b3f"/>
    </marker>
  </defs>
  <rect width="900" height="190" rx="16" fill="#f6f1e8"/>
  <path d="M210 82 H250 M430 82 H470 M650 82 H690" fill="none" stroke="#8c6b3f" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(30 32)" filter="url(#shadow)">
    <rect width="180" height="100" rx="12" fill="#fffdf8" stroke="#9b7a4b" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#34291e">Preflop</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#5f4a31">翻牌前</text>
    <text x="90" y="84" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#76644f">两张底牌</text>
  </g>
  <g transform="translate(250 32)" filter="url(#shadow)">
    <rect width="180" height="100" rx="12" fill="#fffdf8" stroke="#9b7a4b" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#34291e">Flop</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#5f4a31">翻牌</text>
    <text x="90" y="84" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#76644f">三张公共牌</text>
  </g>
  <g transform="translate(470 32)" filter="url(#shadow)">
    <rect width="180" height="100" rx="12" fill="#fffdf8" stroke="#9b7a4b" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#34291e">Turn</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#5f4a31">转牌</text>
    <text x="90" y="84" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#76644f">第四张公共牌</text>
  </g>
  <g transform="translate(690 32)" filter="url(#shadow)">
    <rect width="180" height="100" rx="12" fill="#fffdf8" stroke="#9b7a4b" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#34291e">River</text>
    <text x="90" y="60" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#5f4a31">河牌</text>
    <text x="90" y="84" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#76644f">第五张公共牌</text>
  </g>
  <text x="450" y="163" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5f4a31">每一街行动闭合以后，方可进入下一街</text>
</svg>
